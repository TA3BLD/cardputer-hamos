# The browser installer (tools/flasher) on GitHub Pages, with the firmware of
# the latest release. Runs after a release is published; needs Pages enabled
# with "GitHub Actions" as the source (repository Settings > Pages).
name: installer

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Firmware of the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern hamOS_0x0.bin --dir tools/flasher
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          sed -i "s/__VERSION__/${tag#v}/" tools/flasher/manifest.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tools/flasher/
      - uses: actions/deploy-pages@v4
